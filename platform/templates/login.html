<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTI Nexus — Sign In</title>
<link rel="icon" type="image/png" href="/static/img/favicon.png">
<link rel="stylesheet" href="/static/css/theme.css">
<style>
  * {
    margin: 0; padding: 0; box-sizing: border-box;
    scrollbar-color: var(--border-bright) var(--surface);
    scrollbar-width: thin;
  }
  body {
    background: var(--navy-950);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 14px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    position: relative;
    z-index: 1;
    background: rgba(4, 50, 86, 0.03);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(147, 177, 200, 0.39);
    border-radius: 16px;
    padding: 38px 34px 30px;
    width: 100%;
    max-width: 390px;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
  }
  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .logo-img {
    width: 56px;
    height: 56px;
    object-fit: contain;
    filter: drop-shadow(0 6px 18px rgba(76, 201, 208, 0.35));
  }
  .logo {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    color: #FFFFFF;
    letter-spacing: -0.025em;
    text-align: center;
  }
  .subtitle {
    font-family: var(--font-ui);
    font-size: 13px;
    color: #93B1C8;
    text-align: center;
    margin-bottom: 28px;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 500;
    color: #DCE4EC;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    background: rgba(255, 255, 255, 0.05);
    border: none !important;
    outline: none !important;
    border-radius: 10px;
    color: var(--text-bright);
    font-family: var(--font-ui);
    font-size: 14px;
    padding: 11px 14px;
    box-shadow: none !important;
    transition: background .15s ease;
  }
  .field input::placeholder {
    color: rgba(147, 177, 200, 0.45);
  }
  .field input:hover {
    background: rgba(255, 255, 255, 0.08);
    border: none !important;
    outline: none !important;
    box-shadow: none !important;
  }
  .field input:focus {
    background: rgba(255, 255, 255, 0.11);
    border: none !important;
    outline: none !important;
    box-shadow: none !important;
  }
  .btn-primary {
    width: 100%;
    background: linear-gradient(135deg, #165B99, #2D87A1);
    border: 1px solid rgba(147, 177, 200, 0.39);
    border-radius: 10px;
    color: #FFFFFF;
    font-family: var(--font-ui);
    font-size: 13.5px;
    font-weight: 600;
    padding: 11px;
    cursor: pointer;
    margin-top: 8px;
    box-shadow: 0 4px 16px rgba(17, 79, 136, 0.35);
    transition: transform .12s, box-shadow .15s, border-color .15s, filter .15s;
  }
  .btn-primary:hover:not(:disabled) {
    filter: brightness(1.08);
    border-color: rgba(147, 177, 200, 0.70);
    box-shadow: 0 6px 20px rgba(45, 135, 161, 0.50);
  }
  .btn-primary:disabled { opacity: 0.55; cursor: default; }
  .btn-sso {
    width: 100%;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(147, 177, 200, 0.30);
    border-radius: 10px;
    color: var(--text-bright);
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 500;
    padding: 10px;
    cursor: pointer;
    margin-top: 10px;
    transition: border-color .15s, color .15s, background .15s;
    text-decoration: none;
    display: block;
    text-align: center;
  }
  .btn-sso:hover {
    border-color: rgba(147, 177, 200, 0.60);
    background: rgba(255, 255, 255, 0.08);
    color: #FFFFFF;
  }
  .error {
    display: none;
    background: rgba(240, 82, 82, 0.12);
    border: 1px solid rgba(240, 82, 82, 0.38);
    border-radius: 10px;
    color: #FCA5A5;
    font-family: var(--font-ui);
    font-size: 12.5px;
    padding: 9px 12px;
    margin-top: 12px;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 18px 0 8px;
    font-family: var(--font-ui);
    font-size: 11.5px;
    color: var(--text-dim);
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    <img src="/static/img/logo.png" alt="CTI Nexus" class="logo-img">
    <div class="logo">CTI Nexus</div>
  </div>
  <div class="subtitle">Sign in to access the threat intelligence platform</div>

  <div class="field">
    <label for="username">Username</label>
    <input type="text" id="username" autocomplete="username" placeholder="Enter your username"
           onkeydown="if(event.key==='Enter')document.getElementById('password').focus()">
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" placeholder="••••••••"
           onkeydown="if(event.key==='Enter')doLogin()">
  </div>
  <button class="btn-primary" id="login-btn" onclick="doLogin()">Sign In</button>
  <div class="error" id="error-msg"></div>

  {% if oidc_enabled %}
  <div class="divider">or</div>
  <a class="btn-sso" href="/auth/login">Sign in with SSO</a>
  {% endif %}
</div>

<script src="/static/js/ui/icons.js"></script>
<script>
(function () {
  var err = new URLSearchParams(window.location.search).get('error');
  if (err === 'sso_failed')        showError('SSO login failed. Please use local credentials.');
  if (err === 'session_expired')   showError('Session expired — please sign in again.');
  document.getElementById('username').focus();
})();

function showError(msg) {
  var el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}

async function doLogin() {
  var username = document.getElementById('username').value.trim();
  var password = document.getElementById('password').value;
  var btn = document.getElementById('login-btn');
  if (!username) { showError('Username required.'); return; }
  if (!password) { showError('Password required.'); return; }

  btn.textContent = 'Signing in…';
  btn.disabled = true;
  document.getElementById('error-msg').style.display = 'none';

  try {
    var res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (!res.ok) {
      showError(res.status === 401 ? 'Incorrect Username/Password' : 'Server error ' + res.status);
      return;
    }
    var data = await res.json();
    localStorage.setItem('cti_jwt', data.access_token);
    try { sessionStorage.removeItem('cti_notif_shown'); } catch (e) {}
    window.location.href = '/';
  } catch(e) {
    showError('Network error: ' + e.message);
  } finally {
    btn.textContent = 'Sign In';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
