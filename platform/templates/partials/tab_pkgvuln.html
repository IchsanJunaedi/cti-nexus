  <!-- ── PKG VULN VIEW ── -->
  <div id="cveview-pkgvuln" style="display:none">

    <!-- Stats row (vulns only) -->
    <div id="pv-stats-grid" class="cve-grid cve-grid--5" style="margin-bottom:16px;display:none">
      <div class="cve-stat-box">
        <div class="cve-stat-label">Packages Monitored</div>
        <div class="cve-stat-value info" id="pv-stat-packages">—</div>
      </div>
      <div class="cve-stat-box">
        <div class="cve-stat-label">Critical Vulns</div>
        <div class="cve-stat-value crit" id="pv-stat-critical">—</div>
      </div>
      <div class="cve-stat-box">
        <div class="cve-stat-label">High Vulns</div>
        <div class="cve-stat-value high" id="pv-stat-high">—</div>
      </div>
      <div class="cve-stat-box">
        <div class="cve-stat-label">CISA KEV</div>
        <div class="cve-stat-value" style="color:#DA3633" id="pv-stat-kev">—</div>
      </div>
      <div class="cve-stat-box">
        <div class="cve-stat-label">Unacknowledged</div>
        <div class="cve-stat-value med" id="pv-stat-unacked">—</div>
      </div>
    </div>

    <!-- Filter + actions bar (vulns only) -->
    <div id="pv-filter-bar" class="filter-bar cve-filter-panel pv-filter-panel" style="margin-bottom:16px;display:none">
      <div class="pv-filter-left">
        <span class="filter-label cve-filter-title">
          <i data-ic="filter" class="cve-filter-title-ic"></i>FILTER
        </span>
        <div class="cve-search-box" style="min-width:200px">
          <i data-ic="search" class="cve-search-ic"></i>
          <input type="text" class="filter-input" id="pv-search"
                 placeholder="Advisory ID, CVE, summary…"
                 onkeydown="if(event.key==='Enter')pvLoadVulns()">
        </div>
        <select class="filter-select" id="pv-severity-filter" style="min-width:130px" onchange="pvLoadVulns()">
          <option value="">All Severities</option>
          <option value="CRITICAL">Critical</option>
          <option value="HIGH">High</option>
          <option value="MEDIUM">Medium</option>
          <option value="LOW">Low</option>
        </select>
        <select class="filter-select" id="pv-pkg-filter" style="min-width:160px" onchange="pvLoadVulns()">
          <option value="">All Packages</option>
        </select>
        <label class="cve-check-pill pv-check-pill" title="Filter for CISA Known Exploited Vulnerabilities">
          <input type="checkbox" id="pv-kev-filter" onchange="pvLoadVulns()">
          <span style="color:#93B1C8">KEV Only</span>
        </label>
        <label class="cve-check-pill pv-check-pill" title="Filter for unacknowledged vulnerabilities">
          <input type="checkbox" id="pv-unacked-filter" onchange="pvLoadVulns()">
          <span style="color:#93B1C8">Unacked Only</span>
        </label>
      </div>

      <div class="pv-filter-right">
        <button class="btn-reset cve-btn-reset" onclick="pvResetFilters()">Reset</button>
        <button class="btn-apply cve-btn-apply" onclick="pvLoadVulns()">APPLY</button>
        <button class="btn-reset cve-tool-btn pv-scan-btn" id="pv-scan-btn"
                onclick="pvScanAll(this)"
                title="Scan all monitored packages against osv.dev and deps.dev now">
          <i data-ic="refresh"></i> SCAN ALL NOW
        </button>
      </div>
    </div>

    <!-- View toggle: Vulns list vs Packages list -->
    <div class="cve-inner-toggle" style="margin-bottom:16px">
      <button id="pv-view-vulns-btn" class="ta-submenu-btn active" onclick="pvSwitchSubview('vulns')"
              style="font-size:11px;padding:5px 12px">
        Vulnerabilities <span id="pv-vuln-count-badge" class="ta-submenu-count">—</span>
      </button>
      <button id="pv-view-pkgs-btn" class="ta-submenu-btn" onclick="pvSwitchSubview('packages')"
              style="font-size:11px;padding:5px 12px">
        Packages <span id="pv-pkg-count-badge" class="ta-submenu-count">—</span>
      </button>
      <span id="pv-status" class="ta-status" style="margin-left:8px"></span>
    </div>

    <!-- ── Packages subview ── -->
    <div id="pv-subview-packages" style="display:none">

      <!-- Add package + lockfile import row -->
      <div class="pv-pkg-control-bar" style="display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
        <input type="text" class="filter-input" id="pv-pkg-input" placeholder="Package name…" style="width:180px"
               onkeydown="if(event.key==='Enter')pvAddPackage()">
        <input type="text" class="filter-input" id="pv-ver-input" placeholder="Version (optional)…" style="width:130px"
               title="Pin a specific version for version-accurate vulnerability results">
        <select class="filter-select" id="pv-eco-select" style="min-width:130px">
          <option value="npm">npm</option>
          <option value="PyPI">PyPI</option>
          <option value="Go">Go</option>
          <option value="Maven">Maven</option>
          <option value="crates.io">crates.io</option>
          <option value="NuGet">NuGet</option>
          <option value="RubyGems">RubyGems</option>
          <option value="Packagist">Packagist</option>
          <option value="Hex">Hex</option>
        </select>
        <button class="btn-apply cve-btn-apply" onclick="pvAddPackage()" style="margin-left:0">+ ADD</button>

        <div style="height:24px;width:1px;background:rgba(147, 177, 200, 0.20);margin:0 4px"></div>

        <!-- Lockfile import -->
        <label class="btn-reset cve-tool-btn" style="cursor:pointer;white-space:nowrap"
               title="Import packages from requirements.txt, package-lock.json, go.mod, pom.xml, or poetry.lock">
          <i data-ic="upload"></i> IMPORT LOCKFILE
          <input type="file" id="pv-lockfile-input" style="display:none"
                 accept=".txt,.json,.xml,.lock,.mod,.sum"
                 onchange="pvImportLockfile(this)">
        </label>

        <span style="font-family:var(--font-ui);font-size:11px;color:#93B1C8;margin-left:auto"
              id="pv-pkg-total">—</span>
      </div>

      <div class="cve-table-wrapper">
        <table class="cve-table">
          <thead>
            <tr>
              <th class="cve-table th" style="width:40px">#</th>
              <th class="cve-table th">Package</th>
              <th class="cve-table th">Ecosystem</th>
              <th class="cve-table th">Pinned / Latest</th>
              <th class="cve-table th">Vulns</th>
              <th class="cve-table th">Highest</th>
              <th class="cve-table th" title="Direct / Indirect transitive dependencies + OSSF Scorecard">Deps / Score</th>
              <th class="cve-table th">Source</th>
              <th class="cve-table th">Last Scan</th>
              <th class="cve-table th">Actions</th>
            </tr>
          </thead>
          <tbody id="pv-pkg-tbody"></tbody>
        </table>
      </div>
      <div id="pv-pkg-pager"></div>
    </div>

    <!-- ── Vulns subview ── -->
    <div id="pv-subview-vulns">
      <div class="cve-table-wrapper">
        <table class="cve-table">
          <thead>
            <tr>
              <th class="cve-table th" style="width:40px">#</th>
              <th class="cve-table th">Advisory / CVEs</th>
              <th class="cve-table th">Package</th>
              <th class="cve-table th">Summary</th>
              <th class="cve-table th" style="width:90px">Severity</th>
              <th class="cve-table th" style="width:80px" title="Composite score: CVSS × EPSS mult × KEV mult">Score <i data-ic="star" data-size="11"></i></th>
              <th class="cve-table th" style="width:55px">EPSS</th>
              <th class="cve-table th" style="width:100px">Published</th>
              <th class="cve-table th">Fixed In</th>
              <th class="cve-table th" style="width:100px">Status</th>
            </tr>
          </thead>
          <tbody id="pv-vuln-tbody"></tbody>
        </table>
      </div>
      <div id="pv-vuln-pager"></div>
    </div>

  </div>
