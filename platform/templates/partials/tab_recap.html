  <div id="tab-recap" class="tab-panel">

    <!-- Recap toolbar -->
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0 12px;border-bottom:1px solid var(--border);margin-bottom:16px">
      <span style="font-family:var(--font-ui);font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.1em">Recap Date</span>
      <input type="date" id="recap-date"
        style="background:var(--surface);border:1px solid var(--border);color:var(--text);padding:5px 8px;font-size:12px;border-radius:3px;font-family:var(--font-ui)">
      <select id="recap-client" onchange="recapLoadHistory(); recapLoad();"
        style="background:var(--surface);border:1px solid var(--border);color:var(--text);padding:5px 8px;font-size:12px;border-radius:3px;font-family:var(--font-ui);display:none">
        <option value="default">Org-wide (default)</option>
      </select>
      <button onclick="recapLoad()" class="btn-apply" style="font-size:11px;padding:6px 16px">LOAD</button>
      <button onclick="recapGenerate(false)" style="background:rgba(47,129,247,0.12);border:1px solid var(--border-bright);color:var(--accent);padding:6px 16px;font-size:11px;font-family:var(--font-ui);border-radius:3px;cursor:pointer;letter-spacing:.08em"><i data-ic="refresh"></i> GENERATE</button>
      <button onclick="recapGenerate(true)" title="Force regeneration even if cached" style="background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:6px 12px;font-size:11px;font-family:var(--font-ui);border-radius:3px;cursor:pointer;letter-spacing:.08em"><i data-ic="refresh"></i> FORCE REGEN</button>
      <span id="recap-status" style="font-family:var(--font-ui);font-size:11px;color:var(--text-dim);margin-left:auto"></span>
    </div>

    <div id="recap-progress-wrap" style="display:none;margin:-6px 0 16px">
      <div style="height:4px;background:var(--surface);border:1px solid var(--border);border-radius:2px;overflow:hidden">
        <div id="recap-progress-bar" style="height:100%;width:0%;background:var(--accent);transition:width .3s ease"></div>
      </div>
      <div id="recap-progress-label" style="font-family:var(--font-ui);font-size:10px;color:var(--text-dim);margin-top:4px"></div>
    </div>

    <div style="display:grid;grid-template-columns:240px 1fr;gap:18px">

      <!-- History sidebar -->
      <div style="border:1px solid var(--border);border-radius:3px;padding:10px;background:var(--surface);max-height:calc(100vh - 220px);overflow-y:auto">
        <div style="font-family:var(--font-ui);font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)">
          Recap History
        </div>
        <div id="recap-history-list"
          style="display:flex;flex-direction:column;gap:4px;font-family:var(--font-ui);font-size:11px">
          <div style="color:var(--text-dim);padding:6px">Loading…</div>
        </div>
      </div>

      <!-- Recap body -->
      <div id="recap-body" style="min-height:300px">
        <div style="color:var(--text-dim);font-family:var(--font-ui);font-size:12px;padding:24px;text-align:center;border:1px dashed var(--border);border-radius:3px">
          Pick a date and press LOAD, or GENERATE for yesterday.
        </div>
      </div>
    </div>

    <!-- ══ Recap Generate Confirmation Modal ══ -->
    <div class="modal-overlay" id="recap-confirm-overlay" onclick="if(event.target===this)recapConfirmClose()">
      <div class="modal-card" style="max-width:420px">
        <div class="modal-head">
          <span class="modal-type-dot" style="background:var(--accent);box-shadow:0 0 6px var(--accent);margin-top:4px"></span>
          <div class="modal-title" id="recap-confirm-title">Generate Daily Recap</div>
          <button class="modal-close" onclick="recapConfirmClose()"><i data-ic="x"></i></button>
        </div>
        <div class="modal-body" style="padding:22px 20px;gap:0">
          <p id="recap-confirm-msg"
             style="font-size:12px;color:var(--text);font-family:var(--font-ui);margin:0 0 10px;line-height:1.6"></p>
          <p style="font-size:11px;color:var(--text-dim);font-family:var(--font-ui);margin:0;line-height:1.6">
            This calls the LLM and may take 10–30 seconds.
          </p>
          <div id="recap-confirm-warn"
               style="display:none;margin-top:12px;padding:8px 10px;border:1px solid rgba(243,156,18,0.4);background:rgba(243,156,18,0.08);border-radius:2px;font-family:var(--font-ui);font-size:11px;color:var(--orange)">
            <i data-ic="alert-triangle"></i> FORCE REGEN will overwrite the existing recap for this date.
          </div>
        </div>
        <div class="modal-foot" style="display:flex;gap:8px;justify-content:flex-end">
          <button onclick="recapConfirmClose()"
            style="background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:7px 18px;font-size:11px;font-family:var(--font-ui);border-radius:2px;cursor:pointer;letter-spacing:.08em">CANCEL</button>
          <button id="recap-confirm-ok" class="btn-apply" style="font-size:11px;padding:7px 20px">GENERATE</button>
        </div>
      </div>
    </div>
  </div>
