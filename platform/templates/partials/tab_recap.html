  <div id="tab-recap" class="tab-panel">

    <!-- Recap toolbar -->
    <div class="filter-bar" style="margin-bottom:16px;">
      <span class="filter-label">Recap Date</span>
      <div class="filter-group">
        <input type="date" id="recap-date" class="filter-input filter-input--date">
        <select id="recap-client" class="filter-select" onchange="recapLoadHistory(); recapLoad();" style="display:none">
          <option value="default">Org-wide (default)</option>
        </select>
      </div>
      <div class="filter-actions">
        <button onclick="recapLoad()" class="btn-apply" title="Load recap for selected date">LOAD</button>
        <button onclick="recapGenerate(false)" class="btn-reset" title="Generate Daily Recap"><i data-ic="refresh"></i> GENERATE</button>
        <button onclick="recapGenerate(true)" class="btn-reset" title="Force regeneration even if cached"><i data-ic="refresh"></i> FORCE REGEN</button>
        <span id="recap-status" class="recap-status-pill"></span>
      </div>
    </div>

    <div id="recap-progress-wrap" style="display:none;margin:-6px 0 16px">
      <div style="height:4px;background:var(--surface);border:1px solid var(--border);border-radius:2px;overflow:hidden">
        <div id="recap-progress-bar" style="height:100%;width:0%;background:var(--accent);transition:width .3s ease"></div>
      </div>
      <div id="recap-progress-label" style="font-family:var(--font-ui);font-size:10px;color:var(--text-dim);margin-top:4px"></div>
    </div>

    <div style="display:grid;grid-template-columns:240px 1fr;gap:18px">

      <!-- History sidebar -->
      <div class="recap-history-card">
        <div class="recap-history-header">
          <i data-ic="clock"></i> Recap History
        </div>
        <div id="recap-history-list" class="recap-history-list">
          <div style="color:var(--text-dim);padding:6px">Loading…</div>
        </div>
      </div>

      <!-- Recap body -->
      <div id="recap-body" class="recap-body-card" style="min-height:300px">
        <div style="color:var(--text-dim);font-family:var(--font-ui);font-size:12px;padding:24px;text-align:center;border:1px dashed rgba(147, 177, 200, 0.3);border-radius:12px">
          Pick a date and press LOAD, or GENERATE for yesterday.
        </div>
      </div>
    </div>

  </div>
